    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"

    <style>
      :root {
        --bg: #0a0f16; /* Fondo oscuro principal */
        --fg: #e2e8f0; /* Texto claro */
        --accent: #00f3ff; /* Azul neón */
        --neon-shadow: 0 0 8px rgba(0, 243, 255, 0.5), 0 0 16px rgba(0, 243, 255, 0.3);
        --neon-shadow-hover: 0 0 12px rgba(0, 243, 255, 0.8), 0 0 24px rgba(0, 243, 255, 0.6), 0 0 35px rgba(0, 243, 255, 0.4);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 960px;
        padding: 1.5rem 1.25rem;
      }

      header {
        margin: 1rem 0 1rem;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin-bottom: 0.5rem;
        color: var(--accent);
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.6); /* Brillo en el título */
      }

      p.lead {
        font-size: clamp(1rem, 2.2vw, 1.1rem);
        margin: 0 0 1.5rem;
        color: #a0aec0; /* Texto secundario un poco más apagado */
      }

      .button-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.2rem; /* Separación ligeramente mayor para que no se superpongan los brillos */
        margin-bottom: 2rem;
      }

      a.button {
        display: inline-block;
        width: 100%;
        max-width: 350px;
        text-align: center;
        background-color: transparent; /* Fondo transparente para destacar el borde neón */
        color: var(--accent);
        padding: 0.9rem 1rem;
        border: 2px solid var(--accent);
        border-radius: 2rem;
        text-decoration: none;
        font-weight: 700;
        box-shadow: var(--neon-shadow);
        text-shadow: 0 0 4px rgba(0, 243, 255, 0.4);
        transition: all 0.3s ease;
      }

      a.button:hover { 
        background-color: var(--accent); 
        color: var(--bg); /* El texto se vuelve oscuro al hacer hover */
        box-shadow: var(--neon-shadow-hover);
        text-shadow: none;
        transform: translateY(-2px); /* Pequeño efecto de elevación */
      }
      
      a.button:active { 
        transform: translateY(1px); 
        box-shadow: var(--neon-shadow);
      }

      footer {
        margin-top: auto;
        width: 100%;
        padding: 1rem 0;
        font-size: 0.9rem;
        color: #718096;
      }

      footer a {
        color: var(--accent);
        text-decoration: none;
        transition: text-shadow 0.3s ease;
      }

      footer a:hover {
        text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
      }
    </style>
  </head>
